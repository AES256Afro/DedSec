name: Deploy

# Builds the static client and publishes it to GitHub Pages. The site is plain
# ES modules with no server component, so "deploy" is just uploading a folder.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One in-flight deploy at a time; a queued run supersedes an older one but is
# never cancelled mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Typecheck and the simulation suite gate the deploy: a broken world
      # should never reach the domain.
      - run: npm test

      - run: npm run build:site

      # `pages: write` lets a workflow publish to a Pages site that already
      # exists; it cannot *create* one. That is an admin operation, and asking
      # for it returns "Resource not accessible by integration" — which as an
      # error is both cryptic and unfixable from inside the repository.
      #
      # So: check first. If Pages is off, the build still succeeds (the code is
      # fine) and the run explains exactly what to click. Only genuine breakage
      # turns this workflow red.
      - name: is Pages enabled?
        id: pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" > pages.json 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "cname=$(jq -r '.cname // ""' pages.json)" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      # A deploy can go completely green and still serve a 404, because the
      # hostname → repository mapping lives in a *setting* rather than in this
      # repository. When that setting is empty, GitHub has no idea it is meant to
      # answer for the domain, and every request gets "There isn't a GitHub Pages
      # site here" — with nothing red anywhere to explain it.
      #
      # So the run says what GitHub actually thinks the domain is, next to what
      # the build asked for. Guessing at this cost several hours once already.
      - name: does GitHub agree about the domain?
        if: steps.pages.outputs.enabled == 'true'
        run: |
          want="$(cat site/CNAME 2>/dev/null || true)"
          got="${{ steps.pages.outputs.cname }}"
          {
            echo "## Pages"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| built for | \`${want:-<none>}\` |"
            echo "| GitHub serves | \`${got:-<none, default domain only>}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$want" != "$got" ]; then
            {
              echo
              echo "These do not match, so the custom domain will 404."
              echo
              echo "Fix: **Settings → Pages → Custom domain** → \`${want}\` → Save."
              echo "It must be the whole hostname. A bare label is rejected with"
              echo "\"not properly formatted\", and the field is left empty — which"
              echo "looks like nothing happened."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Pages custom domain is '${got:-unset}' but the build expects '${want}' — the domain will 404 until they match."
          fi

      - name: explain how to turn Pages on
        if: steps.pages.outputs.enabled != 'true'
        run: |
          {
            echo "## Site built, but not published"
            echo
            echo "GitHub Pages is not enabled for this repository, and a workflow token"
            echo "cannot enable it — creating a Pages site is an admin operation, which"
            echo "fails with \`Resource not accessible by integration\`."
            echo
            echo "**One-time fix:** Settings → Pages → *Build and deployment* →"
            echo "Source: **GitHub Actions**. Then re-run this workflow."
            echo
            echo "After that, point the domain at Pages with a DNS record:"
            echo
            echo "| Type | Name | Value |"
            echo "| --- | --- | --- |"
            echo "| CNAME | \`dedsec\` | \`${{ github.repository_owner }}.github.io.\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::Pages is not enabled — the site was built but not published. See the run summary for the one setting to change."

      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.published == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
